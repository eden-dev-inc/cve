name: Check CVE bundles

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed bundles
        run: python3 scripts/check-bundles.py --base HEAD^1
